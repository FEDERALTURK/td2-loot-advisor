# TD2 Rapor Paneli: Windows programını derler, uçtan uca test eder (sahte GitHub), ekran görüntülerini ve exe'yi yükler.
name: Build report panel

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: "Program deposu dalı (lisans testi için)"
        default: "main"
      release:
        description: "Testler geçerse panel sürümünü bu (özel) depoda yayınla (panel-vX.Y.Z) — panel kendini güncelleyebilsin"
        type: boolean
        default: false
  push:
    paths: ["panel/**", "tests/**", ".github/workflows/panel-build.yml"]

permissions:
  contents: write

jobs:
  panel:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build exe
        shell: cmd
        run: panel\build_panel.bat
      - name: End-to-end test (fake GitHub) + screenshots
        shell: cmd
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install --quiet pillow
          python tests\panel_shot.py
      - name: PIN lock + self-update test
        shell: cmd
        env:
          PYTHONIOENCODING: utf-8
        run: python tests\lock_test.py
      - uses: actions/checkout@v5
        with:
          repository: FEDERALTURK/td2-loot-advisor
          ref: ${{ github.event.inputs.app_ref || 'main' }}
          path: app
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Users & licenses tab (local account server)
        if: hashFiles('app/server/dev_server.mjs') != ''
        shell: cmd
        env:
          PYTHONIOENCODING: utf-8
        run: python tests\license_shot.py
      - name: Community tasks tab (local server, fake players)
        if: hashFiles('app/server/tasks.js') != ''
        shell: cmd
        env:
          PYTHONIOENCODING: utf-8
        run: python tests\tasks_shot.py
      - name: Dashboard tab (local server, fake version pings)
        if: hashFiles('app/server/overview.js') != ''
        shell: cmd
        env:
          PYTHONIOENCODING: utf-8
        run: python tests\dashboard_shot.py
      - name: Smoke test - start the exe
        shell: pwsh
        run: |
          $env:TD2_PANEL_CONFIG = "$env:RUNNER_TEMP\panel_cfg.json"
          $env:TD2_PANEL_NOLOCK = "1"
          '{"repo":"x/y","token":"t","api":"http://127.0.0.1:9"}' | Out-File -Encoding utf8 $env:TD2_PANEL_CONFIG
          $c = Start-Process dist\panel\TD2RaporPaneli.exe -ArgumentList "--selfcheck" -PassThru
          if (-not $c.WaitForExit(40000)) { Stop-Process -Id $c.Id -Force; throw "selfcheck hung (error dialog?)" }
          if ($c.ExitCode -ne 0) { throw "selfcheck exit code $($c.ExitCode)" }
          $p = Start-Process dist\panel\TD2RaporPaneli.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "panel exe exited (code $($p.ExitCode))" }
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("shots\panel_exe.png")
          Stop-Process -Id $p.Id -Force
          Write-Host "exe ran fine"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-panel
          path: |
            dist/panel/TD2RaporPaneli.exe
            shots/panel_*.png
      - name: Publish panel release (private repo)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path panel\panel.py -Pattern '^VERSION = "(\d+\.\d+\.\d+)"').Matches[0].Groups[1].Value
          $tag = "panel-v$v"
          Copy-Item dist\panel\TD2RaporPaneli.exe "$env:RUNNER_TEMP\TD2RaporPaneli.exe"
          $h = (Get-FileHash "$env:RUNNER_TEMP\TD2RaporPaneli.exe" -Algorithm SHA256).Hash.ToLower()
          "$h  TD2RaporPaneli.exe" | Out-File -Encoding ascii -NoNewline "$env:RUNNER_TEMP\SHA256SUMS"
          gh release view $tag -R $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "$tag zaten var" }
          gh release create $tag -R $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "TD2 Rapor Paneli $v" --notes-file panel\CHANGES.md "$env:RUNNER_TEMP\TD2RaporPaneli.exe" "$env:RUNNER_TEMP\SHA256SUMS"

