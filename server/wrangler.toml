# TD2 Loot Advisor — topluluk istatistik sunucusu (Cloudflare Workers + D1)
# Kurulum adımları: server/README.md
name = "td2-stats"
main = "worker.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "td2stats"
database_id = "ff1ea665-e911-4048-9066-0e72de9589c8"   # td2stats (kendi hesabında: npx wrangler d1 create td2stats)

[vars]
PUBLIC_URL = "https://td2-stats.td2loot.workers.dev"
DISCORD_CLIENT_ID = "1564066001363148920"
ENT_PUBLIC_KEY = "06da3593d93eebb1a2df46d28577eca8b5c96364973194c900b337c1d74288a0"
# Lisans anahtarlarını doğrulayan açık anahtar (features.py PUBLIC_KEY_HEX ile aynı)
LICENSE_PUBKEY = "d70b17497241261ca45bcd05bbaedcd0fdeb3d866de4993d23db3c25274f633a"
MAX_BATCH = "50"
MAX_PER_HOUR = "600"
APNS_BUNDLE_ID = "com.federalturk.td2companion"   # mobile/ios Runner.xcodeproj + android/app build.gradle ile aynı

# Hata rapor sistemi (worker.js /v1/reports endpoints)
# Secrets: npx wrangler secret put GITHUB_TOKEN (ayrı olarak)
# Variables: Cloudflare dashboard'da set et veya npx wrangler secret put ile
REPORTS_REPO = "FEDERALTURK/td2-loot-advisor-reports"
ADMIN_LOGIN = "FEDERALTURK"

# Saatlik temizlik: eski oran kayıtları silinir
[triggers]
crons = ["17 * * * *"]

# HASH_SALT gizli değişkendir, dosyaya yazılmaz:  npx wrangler secret put HASH_SALT

# Android push bildirimi (FCM HTTP v1) — Firebase Admin SDK servis hesabı JSON'unun TAMAMI tek bir secret olarak:
#   npx wrangler secret put FCM_SERVICE_ACCOUNT_JSON
# iOS push bildirimi (APNs HTTP/2 + JWT) — Apple Developer Program'dan alınan .p8 Auth Key + ilgili kimlikler:
#   npx wrangler secret put APNS_AUTH_KEY_P8      (indirilen .p8 dosyasının TAMAMI, PEM metni olarak)
#   npx wrangler secret put APNS_KEY_ID           (Apple Developer > Keys sayfasındaki 10 haneli Key ID)
#   npx wrangler secret put APNS_TEAM_ID           (Apple Developer hesabının 10 haneli Team ID'si)
# APNS_BUNDLE_ID gizli değil, [vars] altında zaten tanımlı (uygulamanın bundle identifier'ı — mobile/ ile aynı).
# APNS_ENV="sandbox" verilirse (opsiyonel) geliştirme/TestFlight APNs sunucusu kullanılır; yoksa production.
# Her iki platform da kendi secret/değişken seti tanımlı değilse BAĞIMSIZ olarak sessizce no-op'tur (bkz. mobile.js).
