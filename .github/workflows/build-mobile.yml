name: Build Companion APK

on:
  workflow_dispatch:
  push:
    tags: ["companion-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/companion-v')
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!value}" ]]; then
              echo "Missing required Android release signing secret: $value" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/td2-release.jks
          cat > android/key.properties <<EOF
          storeFile=td2-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/companion-v* ]]; then
            flutter build apk --release -PplayRelease=true
          else
            flutter build apk --release
          fi
      - name: Rename APK
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "TD2LootAdvisor_Companion_${GITHUB_REF_NAME#companion-v}.apk"
          sha256sum "TD2LootAdvisor_Companion_${GITHUB_REF_NAME#companion-v}.apk" > SHA256SUMS.sha256
      - uses: actions/upload-artifact@v5
        with:
          name: TD2LootAdvisor-companion-apk
          path: |
            mobile/TD2LootAdvisor_Companion_*.apk
            mobile/SHA256SUMS.sha256
      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: rm -f android/td2-release.jks android/key.properties
      - name: Publish companion release
        if: startsWith(github.ref, 'refs/tags/companion-v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.TD2_RELEASE_TOKEN || github.token }}
          tag_name: ${{ github.ref_name }}
          name: TD2 Loot Advisor Companion ${{ github.ref_name }}
          prerelease: true
          files: |
            mobile/TD2LootAdvisor_Companion_*.apk
            mobile/SHA256SUMS.sha256
