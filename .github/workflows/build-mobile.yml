name: Build Companion APK

on:
  workflow_dispatch:
  push:
    tags: ["companion-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Decode beta signing keystore
        env:
          BETA_KEYSTORE_BASE64: ${{ secrets.TD2_BETA_KEYSTORE_BASE64 }}
          BETA_KEYSTORE_PASSWORD: ${{ secrets.TD2_BETA_KEYSTORE_PASSWORD }}
          BETA_KEY_ALIAS: ${{ secrets.TD2_BETA_KEY_ALIAS }}
          BETA_KEY_PASSWORD: ${{ secrets.TD2_BETA_KEY_PASSWORD }}
        run: |
          missing=0
          for name in BETA_KEYSTORE_BASE64 BETA_KEYSTORE_PASSWORD BETA_KEY_ALIAS BETA_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Gerekli Android beta signing secret eksik: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Debug signing fallback kapatıldı; release APK üretilmeyecek. Bkz. docs/mobile_beta_signing_tr.md."
            exit 1
          fi
          echo "$BETA_KEYSTORE_BASE64" | base64 -d > android/td2-companion-beta.jks
          cat > android/beta-key.properties <<EOF
          storeFile=td2-companion-beta.jks
          storePassword=${BETA_KEYSTORE_PASSWORD}
          keyAlias=${BETA_KEY_ALIAS}
          keyPassword=${BETA_KEY_PASSWORD}
          EOF
          echo "USE_BETA_SIGNING=true" >> "$GITHUB_ENV"
      - run: flutter build apk --release --android-project-arg=githubBetaRelease=true
      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: rm -f android/td2-companion-beta.jks android/beta-key.properties
      - name: Rename APK
        shell: bash
        run: |
          project_version="$(sed -nE 's/^version:[[:space:]]*([0-9]+(\.[0-9]+)*)(\+[0-9]+)?[[:space:]]*$/\1/p' pubspec.yaml)"
          if [[ ! "$project_version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Could not read a valid Companion version from pubspec.yaml"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/companion-v* ]]; then
            version="${GITHUB_REF_NAME#companion-v}"
            if [[ "$version" != "$project_version" ]]; then
              echo "::error::Companion tag version ($version) does not match pubspec.yaml ($project_version)"
              exit 1
            fi
          else
            version="$project_version"
          fi
          apk="TD2LootAdvisor_Companion_${version}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          sha256sum "$apk" > SHA256SUMS.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: TD2LootAdvisor-companion-apk
          path: |
            mobile/TD2LootAdvisor_Companion_*.apk
            mobile/SHA256SUMS.sha256
      - name: Publish companion release
        if: startsWith(github.ref, 'refs/tags/companion-v')
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.TD2_RELEASE_TOKEN || github.token }}
          tag_name: ${{ github.ref_name }}
          name: TD2 Loot Advisor Companion ${{ github.ref_name }}
          prerelease: true
          files: |
            mobile/TD2LootAdvisor_Companion_*.apk
            mobile/SHA256SUMS.sha256
