# Geri bildirim akışı: programdan rapor → Rapor Paneli'nden yanıt → programda yanıt. Ekran videosu + görüntüler.
name: Feedback flow video (Windows)

on:
  workflow_dispatch:

jobs:
  feedback:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        shell: cmd
        run: |
          python -m pip install -r requirements.txt
          python -m pip install onnxruntime rapidocr pillow
          choco install ffmpeg -y --no-progress
      - name: Screen resolution
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Build panel exe
        shell: cmd
        run: panel\build_panel.bat
      - name: Feedback flow test (recorded)
        shell: pwsh
        timeout-minutes: 8
        env:
          PYTHONIOENCODING: utf-8
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $ff = (Get-Command ffmpeg -ErrorAction SilentlyContinue).Source
          if (-not $ff) { $ff = "C:\ProgramData\chocolatey\bin\ffmpeg.exe" }
          $rec = Start-Process $ff -ArgumentList "-y -f gdigrab -framerate 15 -draw_mouse 1 -i desktop -c:v libx264 -preset veryfast -pix_fmt yuv420p shots\feedback_flow.mp4" -PassThru -RedirectStandardInput "NUL" -NoNewWindow
          Start-Sleep 2
          python tests\ui_feedback_test.py
          $code = $LASTEXITCODE
          Start-Sleep 1
          # ffmpeg'i nazikçe durdur (q) — yoksa mp4 bozuk kalır
          Add-Type -Namespace W -Name K -MemberDefinition '[DllImport("kernel32.dll")] public static extern bool GenerateConsoleCtrlEvent(uint e, uint p); [DllImport("kernel32.dll")] public static extern bool AttachConsole(uint p); [DllImport("kernel32.dll")] public static extern bool FreeConsole(); [DllImport("kernel32.dll")] public static extern bool SetConsoleCtrlHandler(System.IntPtr h, bool a);'
          [W.K]::SetConsoleCtrlHandler([System.IntPtr]::Zero, $true) | Out-Null
          [W.K]::GenerateConsoleCtrlEvent(0, 0) | Out-Null
          if (-not $rec.WaitForExit(15000)) { Stop-Process -Id $rec.Id -Force }
          [W.K]::SetConsoleCtrlHandler([System.IntPtr]::Zero, $false) | Out-Null
          Get-ChildItem shots | Format-Table Name, Length
          if (Test-Path logs\app.log) { Get-Content logs\app.log | Select-String -Pattern "Feedback|Traceback|Error" }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-video
          path: |
            shots/fb_*.png
            shots/feedback_flow.mp4
