# Geri bildirim akışı: programdan rapor → Rapor Paneli'nden yanıt → programda yanıt. Ekran videosu + görüntüler.
name: Feedback flow video (Windows)

on:
  workflow_dispatch:

jobs:
  feedback:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        shell: cmd
        run: |
          python -m pip install -r requirements.txt
          python -m pip install onnxruntime rapidocr pillow
          choco install ffmpeg -y --no-progress
      - name: Screen resolution
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Build panel exe
        shell: cmd
        run: panel\build_panel.bat
      - name: Feedback flow test (recorded)
        shell: pwsh
        timeout-minutes: 8
        env:
          PYTHONIOENCODING: utf-8
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $ff = (Get-Command ffmpeg -ErrorAction SilentlyContinue).Source
          if (-not $ff) { $ff = "C:\ProgramData\chocolatey\bin\ffmpeg.exe" }
          $psi = New-Object System.Diagnostics.ProcessStartInfo $ff
          $psi.Arguments = "-y -f gdigrab -framerate 15 -draw_mouse 1 -i desktop -c:v libx264 -preset veryfast -pix_fmt yuv420p -vf scale=trunc(iw/2)*2:trunc(ih/2)*2 shots\feedback_flow.mp4"
          $psi.UseShellExecute = $false; $psi.RedirectStandardInput = $true; $psi.CreateNoWindow = $true
          $rec = [System.Diagnostics.Process]::Start($psi)
          Start-Sleep 3
          python tests\ui_feedback_test.py
          $code = $LASTEXITCODE
          Start-Sleep 1
          $rec.StandardInput.Write("q"); $rec.StandardInput.Flush()       # ffmpeg'i düzgün kapat (mp4 tamamlanır)
          if (-not $rec.WaitForExit(20000)) { $rec.Kill() }
          Get-ChildItem shots | Format-Table Name, Length
          if (Test-Path logs\app.log) { Get-Content logs\app.log | Select-String -Pattern "Feedback|Traceback|Error" }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-video
          path: |
            shots/fb_*.png
            shots/feedback_flow.mp4
