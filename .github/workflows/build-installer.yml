# Windows kurulum dosyasını GitHub'ın Windows sunucusunda derler.
# Elle: Actions → "Build Windows installer" → Run workflow.  Etiket (v5.0 gibi) gönderilince Releases'e de ekler.
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build installer
        shell: cmd
        env:
          CI: "1"
        run: scripts\build_installer.bat

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: TD2LootAdvisor-installer
          path: installer/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/*
          generate_release_notes: true
