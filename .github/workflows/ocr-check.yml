# OCR motorları karşılaştırması (Windows): RapidOCR ve Windows'un yerleşik OCR'ı, örnek kartlarda.
name: OCR engines check (Windows)

on:
  workflow_dispatch:

jobs:
  ocr:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - name: Install
        shell: cmd
        run: |
          python -m pip install -r requirements.txt
          python -m pip install onnxruntime rapidocr numpy winrt-Windows.Media.Ocr winrt-Windows.Globalization winrt-Windows.Graphics.Imaging winrt-Windows.Storage.Streams winrt-Windows.Foundation winrt-Windows.Foundation.Collections
      - name: Compare engines
        shell: cmd
        env: { PYTHONIOENCODING: utf-8 }
        run: python tests\test_winocr.py
      - name: Core tests
        shell: cmd
        env: { PYTHONIOENCODING: utf-8 }
        run: python tests\test_core.py
