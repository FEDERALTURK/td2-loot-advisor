# OCR motorları karşılaştırması (Windows): RapidOCR ve Windows'un yerleşik OCR'ı, örnek kartlarda.
name: OCR engines check (Windows)

on:
  workflow_dispatch:

env:
  TD2_NO_WELCOME: "1"      # hesap karşılama penceresi diğer arayüz testlerini örtmesin
jobs:
  ocr:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - name: Install
        shell: cmd
        run: |
          python -m pip install -r requirements.txt
          python -m pip install openpyxl onnxruntime-directml rapidocr numpy
      - name: DirectML probe (GPU path, separate process)
        shell: cmd
        env: { PYTHONIOENCODING: utf-8 }
        run: python tests\test_gpu_probe.py
      - name: Report runtime matrix
        shell: cmd
        run: python --version
      - name: OCR accuracy with DirectML build of onnxruntime
        shell: cmd
        env: { PYTHONIOENCODING: utf-8 }
        run: python tests\test_ocr.py rapidocr
      - name: Core tests
        shell: cmd
        env: { PYTHONIOENCODING: utf-8 }
        run: python tests\test_core.py
