# Windows'ta programı kaynaktan açıp açılıştan sonra ekran görüntüsü alır (arayüz hatalarını görmek için).
name: UI check (Windows screenshot)

on:
  workflow_dispatch:

jobs:
  shot:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        shell: cmd
        run: |
          python -m pip install -r requirements.txt
          python -m pip install onnxruntime rapidocr
      - name: Start app and take screenshots
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          New-Item -ItemType Directory shots | Out-Null
          $p = Start-Process python -ArgumentList "app.py" -PassThru
          Start-Sleep 3;  Shot "01_after_3s"
          Start-Sleep 5;  Shot "02_after_8s"
          Start-Sleep 10; Shot "03_after_18s"
          if (Test-Path logs\app.log) { Get-Content logs\app.log -Tail 30 }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
      - uses: actions/upload-artifact@v5
        with:
          name: ui-shots
          path: shots/*
