# Ekran senkron testi: sahte oyun penceresi açılır, program onu bulup yalnız onun alanını okumalı.
name: Sync check (Windows)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        shell: cmd
        run: |
          python -m pip install -r requirements.txt
          python -m pip install onnxruntime rapidocr
      - name: Window / DPI / profile sync test
        shell: cmd
        run: python tests/test_windows_sync.py
