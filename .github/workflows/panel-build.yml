# TD2 Rapor Paneli: Windows programını derler, uçtan uca test eder (sahte GitHub), ekran görüntülerini ve exe'yi yükler.
name: Build report panel

on:
  workflow_dispatch:
  push:
    paths: ["panel/**", "tests/panel_shot.py", ".github/workflows/panel-build.yml"]

jobs:
  panel:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build exe
        shell: cmd
        run: panel\build_panel.bat
      - name: End-to-end test (fake GitHub) + screenshots
        shell: cmd
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install --quiet pillow
          python tests\panel_shot.py
      - name: Smoke test - start the exe
        shell: pwsh
        run: |
          $env:TD2_PANEL_CONFIG = "$env:RUNNER_TEMP\panel_cfg.json"
          '{"repo":"x/y","token":"t","api":"http://127.0.0.1:9"}' | Out-File -Encoding utf8 $env:TD2_PANEL_CONFIG
          $c = Start-Process dist\panel\TD2RaporPaneli.exe -ArgumentList "--selfcheck" -PassThru
          if (-not $c.WaitForExit(40000)) { Stop-Process -Id $c.Id -Force; throw "selfcheck hung (error dialog?)" }
          if ($c.ExitCode -ne 0) { throw "selfcheck exit code $($c.ExitCode)" }
          $p = Start-Process dist\panel\TD2RaporPaneli.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "panel exe exited (code $($p.ExitCode))" }
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("shots\panel_exe.png")
          Stop-Process -Id $p.Id -Force
          Write-Host "exe ran fine"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-panel
          path: |
            dist/panel/TD2RaporPaneli.exe
            shots/panel_*.png
