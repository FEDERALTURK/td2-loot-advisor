name: Build Xbox Companion (UWP)

# NOT: Bu, xbox-companion/ içindeki klasik UWP projesinin GERÇEK MSBuild ile
# derlendiğini doğrulayan TEK yol — bu proje bir Linux kum havuzunda, hiçbir
# Windows/UWP araç zinciri olmadan yazıldı (bkz. xbox-companion/README.md
# "Doğrulama durumu"). Bu workflow yalnız DERLEME doğrular; paketleme/imzalama
# (MSIX/APPX üretimi) veya gerçek bir Xbox'a dağıtım YAPMAZ.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: xbox-companion
    steps:
      - uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Windows SDK / UWP metadata durumunu teşhis et (Windows.winmd var mı?)
        # Önceki 4 CI denemesinde System.String gibi temel BCL tiplerinin
        # çözülememesi ayrı bir sorundu (facade Reference eksikliği — bkz.
        # commit 186f12d, kök neden bulundu ve düzeltildi). Bu adım, Windows.*
        # (WinRT) ad alanlarının kaynağı olan Windows.winmd'nin koşucuda zaten
        # var olup olmadığını kanıtla doğruluyor — tahmin yok.
        shell: pwsh
        run: |
          Write-Host "--- Windows Kits\10\UnionMetadata ---"
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\UnionMetadata" -ErrorAction SilentlyContinue | Format-Table Name
          Write-Host "--- Windows Kits\10\Platforms\UAP ---"
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Platforms\UAP" -ErrorAction SilentlyContinue -Recurse -Filter "*.winmd" | Select-Object -First 20 FullName
          Write-Host "--- VS kurulu bileşenler (UWP ile ilgili) ---"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = (& $vswhere -latest -property installationPath)
          $channelId = (& $vswhere -latest -property channelId)
          & $vswhere -latest -products '*' -property "packages" 2>$null |
            Select-String -Pattern "UWP|Windows10SDK|Windows11SDK" | Select-Object -First 30
          Write-Host "VS install path: $vsPath"
          Write-Host "VS channelId: $channelId"

      - name: TEŞHİS — vs_installer/setup.exe'nin gerçek davranışını kanıtla (9. deneme sonrası, kod değişikliği YOK)
        # 9. deneme (bu oturumdan önceki commit) Microsoft dokümantasyonunun
        # "channelId modify için zorunlu" iddiasını test etti — vswhere'den
        # dinamik olarak doğru channelId ("VisualStudio.18.Release") okunup
        # geçirildi, AMA exit 87 ve log dosyasızlık AYNI şekilde, ~5 saniyede
        # tekrar oluştu. Bu, channelId teorisini KANITLA çürütüyor — tahmin
        # etmeyi bırakıp aracın kendisini sorguluyoruz. continue-on-error
        # ile bu adım job'u durdurmuyor; amaç tek bir CI turunda maksimum
        # kanıt toplamak (AGENTS.md madde 10: kanıtla desteklenen varsayımı
        # test et, aynı yöntemi gerekçesiz tekrarlama).
        shell: pwsh
        continue-on-error: true
        run: |
          $installerDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          Write-Host "--- Installer dizini içeriği ---"
          Get-ChildItem $installerDir -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object Name, Length, LastWriteTime | Format-Table

          Write-Host "--- whoami / grup üyeliği (yükseltme durumu) ---"
          whoami /groups 2>&1 | Select-String -Pattern "Administrators|Mandatory Label"

          $vs_installer = Join-Path $installerDir "vs_installer.exe"
          $setup = Join-Path $installerDir "setup.exe"

          function Test-Invocation($exePath, $argList, $label) {
            Write-Host "=== $label ==="
            Write-Host "Var mı: $(Test-Path $exePath)"
            if (-not (Test-Path $exePath)) { return }
            $outFile = "$env:RUNNER_TEMP\$($label)_stdout.txt"
            $errFile = "$env:RUNNER_TEMP\$($label)_stderr.txt"
            Remove-Item $outFile, $errFile -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exePath -ArgumentList $argList -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput $outFile -RedirectStandardError $errFile
            Write-Host "Exit code: $($p.ExitCode)"
            Write-Host "--- stdout ---"
            if (Test-Path $outFile) { Get-Content $outFile } else { Write-Host "(boş)" }
            Write-Host "--- stderr ---"
            if (Test-Path $errFile) { Get-Content $errFile } else { Write-Host "(boş)" }
          }

          # 1) Hiç argüman olmadan / --help ile: araç gerçekten çalışıyor mu,
          #    kabul ettiği gerçek sözdizimini kendi ağzından göster.
          Test-Invocation $vs_installer @("--help") "vs_installer_help"
          Test-Invocation $setup @("--help") "setup_help"

          # 2) Microsoft dokümantasyonunun önerdiği ikili (setup.exe) ile
          #    AYNI modify çağrısını dene — vs_installer.exe değil.
          $vsPath = (& "$installerDir\vswhere.exe" -latest -property installationPath)
          $channelId = (& "$installerDir\vswhere.exe" -latest -property channelId)
          Test-Invocation $setup @(
            "modify", "--installPath", $vsPath, "--channelId", $channelId,
            "--add", "Microsoft.VisualStudio.Workload.Universal",
            "--quiet", "--norestart"
          ) "setup_modify"

      - name: UWP/Windows SDK bileşenini kur (eksikse)
        run: |
          Write-Host "Geçici olarak devre dışı — bu oturum yalnızca teşhis topluyor, yukarıdaki adımın çıktısına bakılacak. Kod/komut değişikliği sonraki oturumda, gerçek kanıta göre yapılacak."
          exit 1
        shell: pwsh

      - name: Restore NuGet packages (packages.config — klasik UWP projesi)
        run: nuget restore XboxCompanion.sln
        shell: cmd

      - name: Build (Release|x64, derleme doğrulaması — paketleme yok)
        run: msbuild XboxCompanion.sln /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /v:minimal
        shell: cmd
